{% extends "shop/base.html" %}
{% block title %}Pay by credit card{% endblock %}
{% block content %}
<h1>Pay by credit card</h1>
<div x-data="{ status: 'Pending' }" x-init="pollStatus()">
    <button @click="openPaymentPopup()">Pay</button>
    <p x-text="'Payment status: ' + status"></p>
    <script>
        function openPaymentPopup() {
            window.open("{{ payment.payment_url }}", "Payment", "width=600,height=400");
        }

        function pollStatus() {
            setInterval(() => {
                fetch("{% url 'payment:payment_status' payment.id %}")
                    .then(response => response.json())
                    .then(data => {
                        if (data.status) {
                            this.status = data.status;
                            if (data.status === 'Fully authorized') {
                                window.location.href = "{% url 'payment:done' %}";
                            } else if (data.status === 'Authorization declined') {
                                window.location.href = "{% url 'payment:canceled' %}";
                            }
                        }
                    });
            }, 5000); // Poll every 5 seconds
        }
    </script>
</div>
{% endblock %}
